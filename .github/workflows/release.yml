name: release

# Pushing a vX.Y.Z tag is the ONLY release step. This workflow turns that tag into a
# GitHub Release automatically, so the Release object can never be forgotten (a pushed
# tag is a git ref; a Release is a separate API object that used to need a manual
# `gh release create`). Notes come straight from the matching CHANGELOG.md section.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # required to create the Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Guard: a tag whose version disagrees with the shipped files (or has no CHANGELOG
      # entry) is a release-hygiene bug. Fail loudly here instead of publishing a mismatch.
      - name: Verify version consistency
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          fail=0
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          skill=$(sed -n 's/^version: *//p' skills/human-html/SKILL.md | head -1)
          [ "$plugin" = "$VERSION" ] || { echo "::error::.claude-plugin/plugin.json version '$plugin' != tag '$VERSION'"; fail=1; }
          [ "$skill" = "$VERSION" ]  || { echo "::error::skills/human-html/SKILL.md version '$skill' != tag '$VERSION'"; fail=1; }
          grep -qE "^## ${VERSION//./\\.} " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; fail=1; }
          exit $fail

      # No other workflow runs the suite, so a tag is the last place to catch a broken
      # validator before it reaches everyone who installs the skill. Stdlib unittest only,
      # no dependencies to install.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      # The shipped examples ARE the documentation an agent copies from, so an example
      # that violates the contract is worse than a docs bug: the example wins. Fail the
      # release rather than publish one.
      - name: Validate the shipped examples
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib, sys
          spec = importlib.util.spec_from_file_location(
              "hha", "skills/human-html/human_html_artifacts.py")
          hha = importlib.util.module_from_spec(spec)
          sys.modules["hha"] = hha
          spec.loader.exec_module(hha)
          bad = 0
          for p in sorted(pathlib.Path("skills/human-html/examples").glob("*.html")):
              parser = hha.ArtifactHTMLParser()
              text = p.read_text(encoding="utf-8")
              parser.feed(text)
              errors, warnings = hha.content_shape_violations(
                  p, text, "2026-07-26", pathlib.Path("."),
                  parser.meta.get("artifact-kind", ""))
              for e in errors:
                  print(f"::error::{e}"); bad += 1
              for w in warnings:
                  print(f"::warning::{w}")
          print(f"validated {len(list(pathlib.Path('skills/human-html/examples').glob('*.html')))} examples")
          sys.exit(1 if bad else 0)
          PY

      # Slice the CHANGELOG section for this version: from its "## X.Y.Z" heading to the
      # next "## " heading, dropping the heading line itself.
      - name: Extract release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## " v " " {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md > release-notes.md
          echo "----- notes -----"; cat release-notes.md

      # Idempotent: re-running on an existing Release must not fail the workflow.
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --latest --verify-tag
          fi
